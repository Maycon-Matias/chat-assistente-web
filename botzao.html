<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BotZão 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: rgba(255,255,255,0.08);
      --accent: #c8f04a;
      --accent-dim: rgba(200,240,74,0.12);
      --text: #f0f0f0;
      --text-muted: #888;
      --bot-bubble: #1e1e1e;
      --user-bubble: #c8f04a;
      --user-text: #0f0f0f;
      --radius: 18px;
      --radius-sm: 10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      max-height: 780px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
    }

    .chat-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: auto;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg-row.user .msg-avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      max-width: 72%;
      padding: 11px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: var(--radius-sm);
      color: var(--text);
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: var(--radius-sm);
      font-weight: 500;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 4px 2px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .input-area {
      padding: 1rem 1.5rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--surface2);
    }

    #user-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 12px 18px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input::placeholder { color: var(--text-muted); }
    #user-input:focus { border-color: rgba(200,240,74,0.4); }

    #send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    #send-btn:hover { transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 20px; height: 20px; }

    .api-key-banner {
      background: rgba(200,240,74,0.08);
      border: 1px solid rgba(200,240,74,0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin: 0 1.5rem 1rem;
      font-size: 12px;
      color: var(--text-muted);
      display: none;
    }

    .api-key-banner a { color: var(--accent); text-decoration: none; }

    @media (max-width: 480px) {
      body { padding: 0; }
      .chat-container { height: 100vh; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h1>BotZão</h1>
      <p>Assistente geral bem-humorado</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-row bot">
      <div class="msg-avatar">🤖</div>
      <div class="bubble">Oi! Sou o BotZão 😄 Tô aqui pra ajudar com qualquer coisa — e garantir que você não morra de tédio no processo. O que você quer saber?</div>
    </div>
  </div>

  <div class="api-key-banner" id="api-banner">
    ⚠️ Conexão com a IA indisponível. Suba o servidor local e configure a chave Gemini no arquivo .env. <a href="https://aistudio.google.com/app/apikey" target="_blank">Gerar chave →</a>
  </div>

  <div class="input-area">
    <input id="user-input" type="text" placeholder="Digite uma mensagem..." autocomplete="off" />
    <button id="send-btn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 2L11 13" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  const API_URL = 'http://localhost:8787/api/chat';

  const history = [];

  function addMessage(content, role, isTyping = false) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (isTyping) {
      bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    } else {
      bubble.textContent = content;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });

    const typingRow = addMessage('', 'bot', true);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          maxTokens: 1000,
          systemPrompt: 'Você é o BotZão, um assistente geral bem-humorado que fala português brasileiro. Você ajuda com qualquer assunto, mas sempre com leveza, bom humor e às vezes uma piada ou comentário engraçado. Seja útil, mas nunca chato. Use emojis ocasionalmente. Respostas diretas e na medida certa.',
          messages: history
        })
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || 'Falha ao chamar a IA');
      }

      const reply = data.reply || 'Sem resposta no momento.';
      typingRow.remove();
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      typingRow.remove();
      const msg = 'Eita, deu ruim 😅 Verifique se o servidor está rodando e se a chave Gemini foi configurada no .env.';
      addMessage(msg, 'bot');
      document.getElementById('api-banner').style.display = 'block';
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>

</body>
</html>
